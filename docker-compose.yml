services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m

  browser-worker:
    profiles: ["browser"]
    build:
      context: .
      dockerfile: apps/browser-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: browser-worker.env
        required: false
    expose:
      - "8090"
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid
      - /home/browserworker/.cache:size=512m
    shm_size: "512m"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m

  voice-worker:
    profiles: ["voice"]
    image: hangrylabs/kokorotts:v0.2
    restart: unless-stopped
    expose:
      - "7860"
    # The worker is reachable only on the private Compose network; no host port is published.
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
